<!doctype html>
<meta charset="utf-8">
<title>Arribada Scorer tests</title>
<style>body{font:14px/1.5 ui-monospace,Consolas,monospace;margin:16px}.ok{color:#2E7D4F}.bad{color:#C2352B}</style>
<pre id="out"></pre>
<script type="module">
import { score, emptyBoard } from "../js/scoring.js";
import { check } from "../js/checks.js";
import { CELL, warp, balance, readBoard, guessCorners, trainingCrops } from "../js/vision.js";
import { findGrid } from "../js/detect.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;
const log = (ok, msg) => { ok ? pass++ : fail++; out.innerHTML += `<span class="${ok ? "ok" : "bad"}">${ok ? "PASS" : "FAIL"}</span> ${msg}\n`; };
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// Rulebook p.14 example: top half of an 11x11 board (1-indexed row, col).
{
  const cells = emptyBoard(11);
  const put = (r, c, owner, v) => (cells[r - 1][c - 1] = { owner, v });
  const P = "pink", G = "green", B = "blue";
  [[1,4,P,7],[1,6,P,5],[1,7,P,5],[1,8,P,2],[1,9,P,7],[2,4,P,7],[2,5,P,6],[2,6,P,5],[2,7,P,4],[2,8,P,3],
   [3,2,B,4],[3,3,B,5],[3,4,P,"W"],[3,5,P,1],[3,6,P,2],[3,7,G,2],[3,9,B,3],[3,10,B,2],[3,11,B,1],
   [4,2,B,7],[4,3,B,6],[4,4,B,7],[4,6,G,3],[4,7,G,3],[4,8,G,3],
   [5,1,G,2],[5,2,G,2],[5,3,B,"W"],[5,4,B,8],[5,6,B,2],[5,7,G,"W"],[5,8,G,4],[6,3,B,4],[6,4,B,4]]
    .forEach((a) => put(...a));
  [[1,3,3],[1,5,6],[3,1,4],[5,5,8],[5,9,8]].forEach(([r, c, v]) => put(r, c, null, v));
  const s = score({ size: 11, cells, players: [P, G, B] });
  log(s.res.pink.strand === -10 && s.res.green.strand === -4 && s.res.blue.strand === -2,
    `rulebook example stranded: pink ${s.res.pink.strand} (want -10), green ${s.res.green.strand} (-4), blue ${s.res.blue.strand} (-2)`);
  log(s.counts[1].pink === 6 && s.counts[1].green === 6 && s.counts[1].blue === 3, "rulebook example upper-right counts 6/6/3");
  log(s.res.pink.q[1] === 18 && s.res.green.q[1] === 18 && s.res.blue.q[1] === 10, "upper-right tie splits 36 into 18/18, blue 10");
  log(s.counts[0].blue === 9 && s.res.blue.q[0] === 20, "upper-left blue 9 tiles scores 20");
}

// 2-player penalties.
{
  const cells = emptyBoard(9);
  [[0,0,1],[0,1,2],[0,2,3]].forEach(([r,c,v]) => cells[r][c] = { owner: "pink", v });
  const s = score({ size: 9, cells, players: ["pink", "purple"] });
  log(s.res.pink.q[0] === 10 && s.res.purple.q[0] === -10, "2p: 3 vs 0 tiles gives +10 / -10");
  log(s.res.pink.q[1] === 0 && s.res.purple.q[1] === 0, "2p: empty quadrant scores nothing");
}

// Checks.
{
  const cells = emptyBoard(9);
  for (let c = 0; c < 9; c++) for (let r = 0; r < 2; r++) cells[r][c] = { owner: null, v: 8 };
  const issues = check({ size: 9, cells, players: ["pink", "purple"] });
  log(issues.some((i) => i.text.includes("only has 10")), "check flags 18 eights");
}

// Photo pipeline on sample photos (local only; photos are not committed).
// Board spec: one row per line, spaces separate cells.
// "." empty, "R" rock, "n4" neutral 4, "g5" green 5, "bW" blue wild (p=pink, u=purple).
const OWN = { p: "pink", g: "green", b: "blue", u: "purple" };
function parseSpec(spec) {
  return spec.trim().split("\n").map((line) => line.trim().split(/\s+/).map((t) => {
    if (t === ".") return null;
    if (t === "R") return { rock: true };
    const owner = t[0] === "n" ? null : OWN[t[0]];
    return { owner, v: t[1] === "W" ? "W" : Number(t[1]) };
  }));
}
const PHOTOS = [
  { file: "photo1.webp", corners: "auto", players: ["pink", "purple"], spec: `
. . . . . . . . .
. . . . . . . . .
. . n7 . n1 p1 pW . .
. . . . . . u4 u4 .
. . n8 . R u6 u5 u4 u4
. . . . . . p3 . .
. . n7 . n5 . n4 . .
. . . . . . . . .
. . . . . . . . .` },
  { file: "photo2.png", corners: "auto", players: ["green", "blue"], spec: `
. . n4 . . . . . n6
. . g6 g7 . . . b5 b4
n2 g6 g5 g4 g4 g4 b3 b4 b4
g8 g7 g5 b6 g3 b3 b2 b3 .
g7 g6 g5 b7 R b3 b1 b3 n2
g6 g6 g5 b8 b8 b3 b2 b3 b2
n2 g5 g5 gW b8 b3 b3 b3 b1
. . g5 . gW . b4 . .
. . n7 . g1 g1 g1 g1 .` },
];
window.training = [];
const total = (s, p) => s.res[p].strand + s.res[p].q.reduce((a, b) => a + b, 0);
for (const P of PHOTOS) {
  try {
    const img = new Image(); img.src = P.file; await img.decode();
    const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height;
    const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, cv.width, cv.height);
    const expect = parseSpec(P.spec), n = expect.length;
    const t0 = performance.now();
    const grid = findGrid(data);
    if (grid.size !== n) log(false, `${P.file}: detected a ${grid.size}x${grid.size} board, expected ${n}x${n}`);
    const w = balance(warp(data, grid.corners, n * CELL), n);
    const res = await readBoard(w, n);
    const ms = performance.now() - t0;
    let right = 0, cellsN = 0, tiles = 0, ownersRight = 0, flaggedWrong = 0;
    const wrong = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      cellsN++;
      const got = res.cells[r][c], want = expect[r][c];
      if (want && !want.rock) { tiles++; if (got && !got.rock && got.owner === want.owner) ownersRight++; }
      if (eq(got, want)) right++;
      else {
        const u = res.unsure.has(r + "," + c);
        if (u) flaggedWrong++;
        wrong.push(`(${r + 1},${c + 1}) got ${JSON.stringify(got)} want ${JSON.stringify(want)}${u ? " [?]" : " [NOT FLAGGED]"}`);
      }
    }
    log(right === cellsN, `${P.file}: ${right}/${cellsN} spaces right, owner right on ${ownersRight}/${tiles} tiles, ${flaggedWrong}/${wrong.length} misses flagged, ${ms.toFixed(0)} ms, rotation ${res.rotation}`);
    wrong.forEach((x) => (out.innerHTML += "   " + x + "\n"));
    const sc = score({ size: n, cells: expect, players: P.players }), sg = score({ size: n, cells: res.cells, players: P.players });
    out.innerHTML += `   end-game points, true: ${P.players.map((p) => p + " " + total(sc, p)).join(", ")}; app: ${P.players.map((p) => p + " " + total(sg, p)).join(", ")}\n`;
    window.training.push({ app: "arribada-scorer", version: 1, source: P.file, size: n, players: P.players, rotation: res.rotation,
      cells: expect, crops: trainingCrops(w, n, 0, expect) });
    const wc = document.createElement("canvas"); wc.width = wc.height = n * CELL; wc.getContext("2d").putImageData(w, 0, 0);
    document.body.append(wc);
  } catch (e) {
    out.innerHTML += `(${P.file} skipped: ${e.message || e})\n`;
  }
}
out.innerHTML += `\n${pass} passed, ${fail} failed\n`;
document.title = `${fail ? "FAIL" : "PASS"} ${pass}/${pass + fail}`;
</script>
